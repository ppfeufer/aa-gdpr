[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling",
]

[project]
name = "aa-gdpr"
description = "Alliance Auth GDPR App"
readme = "README.md"
keywords = [
    "allianceauth",
    "eveonline",
    "forum",
]
license = { file = "LICENSE" }
authors = [
    { name = "Peter Pfeufer", email = "develop@ppfeufer.de" },
]
requires-python = ">=3.10,<3.15"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dynamic = [
    "version",
]
dependencies = [
    "allianceauth>=5.2,<6",
]
optional-dependencies.tests-allianceauth-latest = [
    "coverage",
]
urls.Changelog = "https://github.com/ppfeufer/aa-gdpr/blob/master/CHANGELOG.md"
urls.Codecov = "https://codecov.io/gh/ppfeufer/aa-gdpr"
urls.Discord = "https://discord.gg/fjnHAmk"
urls.Documentation = "https://github.com/ppfeufer/aa-gdpr/blob/master/README.md"
urls.Donation = "https://ko-fi.com/ppfeufer"
urls.GitHub = "https://github.com/ppfeufer/aa-gdpr"
urls.Tracker = "https://github.com/ppfeufer/aa-gdpr/issues"
urls.Translation = "https://weblate.ppfeufer.de/projects/alliance-auth-apps/aa-gdpr/"

[tool.hatch]
version.path = "aagdpr/__init__.py"
build.include = [
    "/aagdpr",
]
