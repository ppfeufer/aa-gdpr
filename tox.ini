[tox]
isolated_build = True
skipsdist = true
usedevelop = true
envlist = py{38, 39, 310, 311, py}

[testenv]
setenv =
    DJANGO_SETTINGS_MODULE = testauth.settingsAA3
deps=
    coverage

install_command = pip install -e ".[test]" -U {opts} {packages}

commands=
    coverage run runtests.py aagdpr -v 2 --debug-mode
    coverage xml
    coverage report -m
