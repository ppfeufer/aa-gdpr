[tox]
isolated_build = True
skipsdist = true
usedevelop = true
envlist = {py38, py39, py310, py311}-django{40}

[testenv]
setenv =
    django40: DJANGO_SETTINGS_MODULE = testauth.settingsAA3
deps=
    django40: allianceauth>=3
    coverage

install_command = pip install -e ".[test]" -U {opts} {packages}

commands=
    coverage run runtests.py aagdpr -v 2 --debug-mode
    coverage xml
    coverage report -m
