[tox]
requires =
    tox>=4.2
env_list =
    {py313, py312, py311, py310}-django52
    {py312, py311, py310}-django42
no_package = true
usedevelop = true

[testenv]
deps =
    coverage
    django42: allianceauth>=4
    django52: allianceauth>=5.0.0a3
set_env =
    django42: DJANGO_SETTINGS_MODULE = testauth.settingsAA4
    django52: DJANGO_SETTINGS_MODULE = testauth.settingsAA4
commands =
    coverage run runtests.py aagdpr -v 2 --debug-mode
    coverage xml
    coverage report -m
install_command = pip install -e ".[test]" -U {opts} {packages}
