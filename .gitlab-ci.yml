stages:
  - pre-commit
  - gitlab
  - test
  - deploy

include:
  - template: Dependency-Scanning.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

before_script:
  - apt-get update && apt-get install redis-server -y
  - redis-server --daemonize yes
  - python -V
  - pip install wheel tox

pre-commit-check:
  stage: pre-commit
  image: python:3.10-bullseye
  variables:
    PRE_COMMIT_HOME: ${CI_PROJECT_DIR}/.cache/pre-commit
  cache:
    paths:
      - ${PRE_COMMIT_HOME}
  script:
    - pip install pre-commit
    - pre-commit run --all-files

sast:
  stage: gitlab
  before_script: []

dependency_scanning:
  stage: gitlab
  before_script:
    - apt-get update && apt-get install redis-server libmariadb-dev -y
    - redis-server --daemonize yes
    - python -V
    - pip install wheel tox

secret_detection:
  stage: gitlab
  before_script: []

.test-py38:
  needs: []
  stage: test
  image: python:3.8-bullseye
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

.test-py39:
  needs: []
  stage: test
  image: python:3.9-bullseye
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml


.test-py310:
  needs: []
  stage: test
  image: python:3.10-bullseye
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml


.test-py311:
  needs: []
  stage: test
  image: python:3.11-rc-bullseye
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  allow_failure: true

test-38-django40:
  extends: .test-py38
  script:
    - tox -e py38-django40

test-39-django40:
  extends: .test-py39
  script:
    - tox -e py39-django40

test-310-django40:
  extends: .test-py310
  script:
    - tox -e py310-django40

test-311-django40:
  extends: .test-py311
  script:
    - tox -e py311-django40

deploy_production:
  stage: deploy
  image: python:3.10-bullseye

  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install --upgrade build
    - python -m pip install --upgrade setuptools wheel twine

  script:
    - python -m build
    - python -m twine upload dist/*

  rules:
    - if: $CI_COMMIT_TAG
